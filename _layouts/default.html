<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | PHIL 3700</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Cinzel', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        void: {
                            bg: '#f8fafc',
                            textMain: '#475569',
                            textLight: '#0f172a',
                            accent: '#8b5cf6',
                            accentDim: '#c4b5fd',
                            glass: 'rgba(255, 255, 255, 0.6)',
                            glassBorder: 'rgba(0, 0, 0, 0.08)'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body class="font-sans antialiased min-h-screen flex flex-col selection:bg-void-accent selection:text-white bg-void-bg text-void-textMain">

    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <nav class="fixed top-0 left-0 w-full z-50 bg-void-bg border-b border-void-glassBorder shadow-sm">
        <div class="py-6 px-6 md:px-12 flex justify-between items-center">
            <div class="font-serif text-2xl md:text-3xl tracking-[0.2em] flex items-center gap-4 text-void-textLight uppercase">
                PHIL 3700
            </div>
            
            <div class="hidden md:flex gap-10 font-sans text-xs uppercase tracking-[0.2em] font-medium">
                <a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a>
                <a href="{{ '/schedule/' | relative_url }}" class="nav-link {% if page.url == '/schedule.html' %}active{% endif %}">Schedule</a>
                <a href="{{ '/resources/' | relative_url }}" class="nav-link {% if page.url == '/resources.html' %}active{% endif %}">Resources</a>
            </div>

            <button id="mobile-menu-btn" class="md:hidden text-void-textMain hover:text-void-textLight focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>

        <div id="mobile-menu" class="hidden md:hidden bg-void-bg border-t border-void-glassBorder shadow-inner">
            <div class="px-6 py-4 flex flex-col gap-4 font-sans text-xs uppercase tracking-[0.2em] font-medium text-void-textMain">
                <a href="{{ '/' | relative_url }}" class="hover:text-void-textLight {% if page.url == '/' %}text-void-textLight font-bold{% endif %}">Home</a>
                <a href="{{ '/schedule/' | relative_url }}" class="hover:text-void-textLight {% if page.url == '/schedule.html' %}text-void-textLight font-bold{% endif %}">Schedule</a>
                <a href="{{ '/resources/' | relative_url }}" class="hover:text-void-textLight {% if page.url == '/resources.html' %}text-void-textLight font-bold{% endif %}">Resources</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-6xl mx-auto px-6 w-full pt-32 pb-32">
        {{ content }}
    </main>

    <footer class="w-full py-12 text-center text-xs tracking-[0.2em] text-void-textMain/40 uppercase font-sans mt-auto">
        © 2026 Dr. Kevin J. Patton. UNO.
    </footer>

    <script>
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');

        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
        });
    </script>

</body>
</html>
