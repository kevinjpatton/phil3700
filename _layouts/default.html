<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | PHIL 3700</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Cinzel', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        void: {
                            bg: '#f8fafc',
                            textMain: '#475569',
                            textLight: '#0f172a',
                            accent: '#8b5cf6',
                            accentDim: '#c4b5fd',
                            glass: 'rgba(255, 255, 255, 0.6)',
                            glassBorder: 'rgba(0, 0, 0, 0.08)'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body class="font-sans antialiased min-h-screen flex flex-col selection:bg-void-accent selection:text-white bg-void-bg text-void-textMain">

    <!-- Ambient Background -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <!-- Global Header -->
    <nav class="fixed top-0 left-0 w-full py-6 px-6 md:px-12 flex justify-between items-center z-50 bg-void-bg border-b border-void-glassBorder shadow-sm">
        <div class="font-serif text-2xl md:text-3xl tracking-[0.2em] flex items-center gap-4 text-void-textLight uppercase">
            PHIL 3700
        </div>
        <div class="hidden md:flex gap-10 font-sans text-xs uppercase tracking-[0.2em] font-medium">
            <a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">Dimensions (Home)</a>
            <a href="{{ '/schedule.html' | relative_url }}" class="nav-link {% if page.url == '/schedule.html' %}active{% endif %}">Continuity (Schedule)</a>
            <a href="{{ '/resources.html' | relative_url }}" class="nav-link {% if page.url == '/resources.html' %}active{% endif %}">Archives (Resources)</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto px-6 w-full pt-32 pb-32">
        {{ content }}
    </main>

    <!-- Footer -->
    <footer class="w-full py-12 text-center text-xs tracking-[0.2em] text-void-textMain/40 uppercase font-sans mt-auto">
        © 2026 Dr. Kevin J. Patton. UNO.
    </footer>

</body>
</html>
